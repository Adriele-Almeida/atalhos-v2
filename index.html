<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Hub">
<title>Meu Hub</title>
<style>
:root{
  --bg:#070E1E;--panel:#0D1B33;--panel2:#0A172B;--line:#1E3D6B;
  --text:#E8F0FF;--muted:#6F91B8;--cyan:#00EAF6;--blue:#59A8FF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:#070E1E;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  background-image:radial-gradient(90% 60% at 50% 0%,#193965 0%,#102746 30%,#091425 63%,#070E1E 100%)
}
button,input{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 44px}
.badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  border:1px solid #214875;background:rgba(8,20,39,.76);font-size:10px;font-weight:800;
  letter-spacing:.16em;color:#8DADD2
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
h1{font-size:38px;line-height:.9;margin:18px 0 7px;font-weight:850;letter-spacing:-.035em}
h1 span{color:var(--cyan)}
.tag{font-size:12px;color:#7C9FC8;letter-spacing:.06em;margin-top:7px;margin-bottom:0}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.topIntro{min-width:0;flex:1}
.topIntro h1{margin-top:18px}
.createGrid{display:flex;gap:8px;flex:0 0 auto}
.createCell{min-width:0}
.createCard{
  width:72px;height:72px;border-radius:18px;border:1px solid #234A78;
  background:linear-gradient(155deg,#244B80,#17365F 60%,#102745);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;padding:8px;box-shadow:0 8px 18px rgba(0,0,0,.22)
}
.createCard.active{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,234,246,.16)}
.createPlus{
  width:28px;height:28px;border-radius:9px;border:1px solid rgba(0,234,246,.22);
  background:#163B67;display:grid;place-items:center
}
.createName{display:block;font-size:8px;line-height:1.15;font-weight:850;letter-spacing:.06em;text-align:center}
.createSub{display:none}
.topFormSlot{width:100%;margin:0 0 14px}
.topFormSlot:empty{display:none}

/* FORM */
.panel{
  border:1px solid #244E80;background:rgba(10,23,43,.96);border-radius:24px;
  padding:20px;margin:2px 0 4px
}
.panelTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.panelTitle{font-size:12px;letter-spacing:.15em;margin:0}
.panelActions{display:flex;align-items:center;gap:8px}
.circleBtn{
  width:36px;height:36px;border-radius:50%;border:1px solid #244E80;background:#0C1D36;
  color:#86A8CC;display:grid;place-items:center
}
.starBtn{font-size:22px;line-height:1}
.starBtn.on{color:#FFD76A;border-color:#9C7A26;background:#2B2410}
label{
  display:block;font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  color:#7091B7;margin-bottom:8px
}
input[type=text],input[type=url]{
  width:100%;height:50px;border-radius:14px;border:1px solid #244E80;background:#06101F;
  color:#fff;padding:0 14px;font-size:14px;outline:none;margin-bottom:16px
}
input:focus{border-color:var(--cyan)}
.icons{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;border:1px solid #244E80;
  background:#06101F;border-radius:14px;padding:10px;margin-bottom:16px
}
.icons button{
  aspect-ratio:1;border-radius:12px;border:1px solid #1E426E;background:#15365F;color:#779CC5;
  display:grid;place-items:center
}
.icons button.sel{border-color:var(--cyan);background:#56DBE9;color:#06101F}
.relation{margin-bottom:16px}
.relationToggle{
  width:100%;height:48px;border-radius:14px;border:1px solid #244E80;background:#06101F;
  color:#AEC7E4;padding:0 14px;display:flex;align-items:center;justify-content:space-between;
  font-size:11px;font-weight:800;letter-spacing:.08em
}
.countPill{min-width:26px;height:26px;border-radius:999px;background:#17365F;display:grid;place-items:center;font-size:10px}
.relationOptions{
  margin-top:8px;border:1px solid #244E80;border-radius:14px;background:#071325;padding:8px;
  max-height:220px;overflow:auto
}
.relationOptions[hidden]{display:none}
.relOption{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;color:#B7CEE8;font-size:12px}
.relOption.selected{background:rgba(0,234,246,.08)}
.relOption + .relOption{border-top:1px solid rgba(36,78,128,.35)}
.relOption input{width:18px;height:18px;accent-color:#00D6E2}
.relEmpty{padding:14px;text-align:center;color:#6384AA;font-size:11px}
.submit{
  width:100%;height:50px;border-radius:14px;border:1px solid rgba(0,234,246,.3);
  background:linear-gradient(#22D5ED,#0FA7C7);color:#04131E;font-size:13px;font-weight:900;
  letter-spacing:.1em
}
.delLink{
  width:100%;margin-top:24px;padding:15px 8px 2px;border:0;border-top:1px solid rgba(36,78,128,.55);
  background:none;color:#6B89AA;font-size:10px;font-weight:800;letter-spacing:.1em
}

/* BAIAS FIXAS */
.fixedBays{display:flex;flex-direction:column;gap:12px;margin:16px 0 18px}
.bay{
  border-radius:22px;background:rgba(9,22,42,.66);overflow:hidden;
  border:1px solid #264F80
}
.bay.shortcuts{border-color:#38A8FF;box-shadow:none}
.bay.groups{border-color:#264F80;box-shadow:none}
.bayHead{
  width:100%;height:72px;border:0;background:linear-gradient(135deg,rgba(30,64,107,.95),rgba(17,39,71,.94));
  color:#fff;padding:0 18px;display:flex;align-items:center;justify-content:space-between
}
.shortcuts .bayHead{
  border:1px solid #39B7FF;
  box-shadow:0 0 14px rgba(57,183,255,.42),inset 0 0 14px rgba(57,183,255,.08);
  background:linear-gradient(135deg,rgba(27,65,112,.98),rgba(13,37,70,.98))
}
.bayHeadLeft{display:flex;align-items:center;gap:12px}
.bayMark{width:10px;height:10px;border-radius:50%}
.shortcuts .bayMark{background:#45ABFF;box-shadow:0 0 12px #45ABFF}
.groups .bayMark{background:#6F91B8;box-shadow:none}
.bayName{font-size:13px;font-weight:850;letter-spacing:.08em}
.bayHead svg{transition:transform .2s}
.bay.open .bayHead svg{transform:rotate(90deg)}
.bayBody{display:none;padding:12px}
.bay.open .bayBody{display:block}

/* ITENS PADRONIZADOS */
.itemList{display:flex;flex-direction:column;gap:10px}
.itemRow{
  position:relative;border-radius:17px;background:#0A1830;overflow:hidden;
  border:1px solid #285B8F;touch-action:pan-y;user-select:none;-webkit-user-select:none
}
.itemRow.shortcut{border-color:#39A9FF;box-shadow:0 0 12px rgba(57,169,255,.13)}
.itemRow.group{border-color:#285B8F;box-shadow:none}
.itemMain{display:flex;align-items:center;min-height:68px}
.itemTextBtn{
  min-width:0;flex:1;min-height:68px;border:0;background:transparent;color:#fff;
  padding:12px 14px 12px 18px;text-align:left
}
.itemKind{display:block;font-size:9px;letter-spacing:.13em;font-weight:800;margin-bottom:5px}
.shortcut .itemKind{color:#4DAEFF}
.group .itemKind{color:#7C9FC8}
.itemTitle{display:block;font-size:12px;font-weight:800;letter-spacing:.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemAction{
  flex:0 0 88px;align-self:stretch;border:0;
  background:rgba(13,30,55,.72);color:#9FD8FF;font-size:10px;font-weight:900;letter-spacing:.12em
}
.group .itemAction{color:#9CB8D6;background:rgba(13,30,55,.5)}
.itemAction:disabled{opacity:.35}
.groupChildren{display:none;padding:0 12px 12px}
.itemRow.group.open .groupChildren{display:block}
.groupChildren .itemList{margin-top:8px}
.groupManage{margin-top:10px;padding-top:2px}
.groupEditBtn{
  width:100%;height:40px;border-radius:11px;border:0;background:#132A4C;
  color:#9CB8D6;font-size:10px;font-weight:850;letter-spacing:.08em
}
.inlineEditSlot:empty{display:none}
.inlineEditSlot:not(:empty){padding:12px 0 0}
.groupPlus{
  width:46px;flex:0 0 46px;align-self:stretch;border:0;
  background:#132A4C;color:#9CB8D6;font-size:24px
}

/* FAVORITOS, SEM TÍTULO */
.favoritesBay{margin-top:18px}
.favoritesBay:empty{display:none}

/* DRAG */
.dragGhost{
  position:fixed!important;z-index:999!important;pointer-events:none!important;margin:0!important;
  box-shadow:0 20px 44px rgba(0,0,0,.5)!important
}
.dragHidden{visibility:hidden}

/* MODAIS */
.overlay{
  position:fixed;inset:0;z-index:500;background:rgba(3,8,18,.8);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:24px
}
.modalBox{
  width:100%;max-width:340px;border-radius:22px;border:1px solid #244E80;
  background:linear-gradient(#132A4C,#0D1B33);padding:22px
}
.modalTitle{font-size:15px;font-weight:850;line-height:1.35}
.modalBtn{
  width:100%;height:44px;border-radius:12px;border:1px solid #244E80;background:#0D1B33;
  color:#E8F0FF;font-weight:800;font-size:11px;letter-spacing:.06em
}
.modalBtn.danger{color:#F2A5B0;border-color:#6B3340;background:#23121A}
.confirmActions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:360px){
  .wrap{padding-left:16px;padding-right:16px}
  .topline{gap:10px}
  .createGrid{gap:6px}
  .createCard{width:66px;height:66px;border-radius:16px}
  .itemAction{flex-basis:76px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div class="topIntro">
      <span class="badge"><span class="dot"></span>MEU HUB <span id="statusText">LOCAL</span></span>
      <h1>MEU <span>HUB</span></h1>
      <div class="tag">Painel de atalhos pessoal</div>
    </div>

    <div class="createGrid">
      <div class="createCell" id="shortcutCreateCell">
        <button class="createCard" id="openShortcutForm" type="button">
          <span class="createPlus"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></span>
          <span class="createName">NOVO<br>ATALHO</span>
        </button>
      </div>

      <div class="createCell" id="groupCreateCell">
        <button class="createCard" id="openGroupForm" type="button">
          <span class="createPlus"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></span>
          <span class="createName">NOVO<br>GRUPO</span>
        </button>
      </div>
    </div>
  </div>

  <div class="topFormSlot" id="topFormSlot"></div>

  <div class="fixedBays">
    <section class="bay shortcuts" id="shortcutsBay">
      <button class="bayHead" id="shortcutsBayToggle" type="button">
        <span class="bayHeadLeft"><span class="bayMark"></span><span class="bayName">ATALHOS</span></span>
        <svg width="17" height="17" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="bayBody"><div class="itemList" id="allShortcutsList"></div></div>
    </section>

    <section class="bay groups" id="groupsBay">
      <button class="bayHead" id="groupsBayToggle" type="button">
        <span class="bayHeadLeft"><span class="bayMark"></span><span class="bayName">GRUPOS</span></span>
        <svg width="17" height="17" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="bayBody"><div class="itemList" id="allGroupsList"></div></div>
    </section>
  </div>

  <div class="favoritesBay" id="favoritesBay"></div>
</div>

<div class="panel" id="panel" style="display:none">
  <div class="panelTop">
    <h2 class="panelTitle" id="panelTitle"></h2>
    <div class="panelActions">
      <button class="circleBtn starBtn" id="starBtn" type="button" aria-label="Favorito">☆</button>
      <button class="circleBtn" id="closePanel" type="button" aria-label="Fechar">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <label>Nome</label>
  <input type="text" id="nameInput">

  <div id="shortcutFields">
    <label>Link</label>
    <input type="url" id="urlInput">

    <label>Ícone</label>
    <div class="icons" id="iconGrid"></div>

    <div class="relation">
      <button class="relationToggle" id="groupsToggle" type="button">
        <span>GRUPOS</span><span class="countPill" id="groupsCount">0</span>
      </button>
      <div class="relationOptions" id="groupsOptions" hidden></div>
    </div>
  </div>

  <div id="groupFields" style="display:none">
    <div class="relation">
      <button class="relationToggle" id="shortcutsToggle" type="button">
        <span>ATALHOS</span><span class="countPill" id="shortcutsCount">0</span>
      </button>
      <div class="relationOptions" id="shortcutsOptions" hidden></div>
    </div>
  </div>

  <button class="submit" id="submitBtn" type="button">SALVAR</button>
  <button class="delLink" id="deleteBtn" type="button" style="display:none"></button>
</div>

<script>
const ICONS = {
  Rocket:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>',
  Globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  Briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  FolderKanban:'<path d="M4 20V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>',
  Palette:'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1 0 1.7-.8 1.7-1.7 0-.9-.7-1.6-.7-2.5A1.7 1.7 0 0 1 14.6 16h2c3 0 5.4-2.5 5.4-5.5C22 5.6 17.5 2 12 2z"/>',
  FileText:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/>',
  Target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  LayoutGrid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  MessageSquare:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  Music2:'<circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/>',
  ShoppingBag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  BookOpen:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  Compass:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.65-5.65 1.8 1.8-5.65z"/>',
  Zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  Layers:'<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m2 12 8.6 3.91a2 2 0 0 0 1.65 0L22 12M2 17l8.6 3.91a2 2 0 0 0 1.65 0L22 17"/>',
  Monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  Box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>'
};
const ICON_KEYS=Object.keys(ICONS);
const LS_KEY="atalhos_v2_local_v3";
const LONG_PRESS_MS=240;

function svgIcon(name,w){
  var size=w||22;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24">'+(ICONS[name]||ICONS.Box)+'</svg>';
}
function esc(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function displayName(v){var t=String(v||'').trim();return t?t:'SEM NOME';}
function openableUrl(v){
  var t=String(v||'').trim();
  if(!t) return '';
  if(!/^https?:\/\//i.test(t)) t='https://'+t;
  try{return new URL(t).href;}catch(e){return '';}
}
function seedState(){
  return {
    version:2,
    shortcuts:[{id:'sample-shortcut',name:'ATALHO EXEMPLO',url:'https://www.google.com',icon:'Rocket',favorite:true}],
    groups:[{id:'sample-group',name:'GRUPO EXEMPLO',favorite:false,open:false,shortcutIds:['sample-shortcut']}],
    favoriteOrder:['s:sample-shortcut'],
    ui:{shortcutsOpen:false,groupsOpen:false}
  };
}
function normalizeState(raw){
  if(!raw||typeof raw!=='object') return seedState();
  var shortcuts=Array.isArray(raw.shortcuts)?raw.shortcuts:[];
  var groups=Array.isArray(raw.groups)?raw.groups:[];
  var shortcutSet=new Set(shortcuts.map(function(s){return s.id;}));
  var groupSet=new Set(groups.map(function(g){return g.id;}));
  var normalized={
    version:2,
    shortcuts:shortcuts.map(function(s){
      return {id:s.id||uid(),name:s.name||'',url:s.url||'',icon:s.icon||'Rocket',favorite:!!s.favorite};
    }),
    groups:groups.map(function(g){
      return {
        id:g.id||uid(),name:g.name||'',favorite:!!g.favorite,open:!!g.open,
        shortcutIds:Array.isArray(g.shortcutIds)?g.shortcutIds.filter(function(id){return shortcutSet.has(id);}):[]
      };
    }),
    favoriteOrder:Array.isArray(raw.favoriteOrder)?raw.favoriteOrder.slice():[],
    ui:{
      shortcutsOpen:!!(raw.ui&&raw.ui.shortcutsOpen),
      groupsOpen:!!(raw.ui&&raw.ui.groupsOpen)
    }
  };
  var allowed=new Set();
  normalized.shortcuts.forEach(function(s){if(s.favorite)allowed.add('s:'+s.id);});
  normalized.groups.forEach(function(g){if(g.favorite)allowed.add('g:'+g.id);});
  normalized.favoriteOrder=normalized.favoriteOrder.filter(function(ref){
    if(!allowed.has(ref)) return false;
    return ref.indexOf('s:')===0?shortcutSet.has(ref.slice(2)):groupSet.has(ref.slice(2));
  });
  allowed.forEach(function(ref){if(normalized.favoriteOrder.indexOf(ref)===-1)normalized.favoriteOrder.push(ref);});
  return normalized;
}
function loadState(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw) return normalizeState(JSON.parse(raw));
  }catch(e){}
  return seedState();
}
function saveState(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
  statusText.textContent='LOCAL';
}
function getShortcut(id){return state.shortcuts.find(function(s){return s.id===id;})||null;}
function getGroup(id){return state.groups.find(function(g){return g.id===id;})||null;}
function entityRef(type,id){return (type==='shortcut'?'s:':'g:')+id;}
function groupIdsForShortcut(id){
  return state.groups.filter(function(g){return g.shortcutIds.indexOf(id)!==-1;}).map(function(g){return g.id;});
}
function setGroupsForShortcut(id,selected){
  state.groups.forEach(function(g){
    var has=g.shortcutIds.indexOf(id)!==-1;
    var should=selected.has(g.id);
    if(should&&!has)g.shortcutIds.push(id);
    if(!should&&has)g.shortcutIds=g.shortcutIds.filter(function(x){return x!==id;});
  });
}
function ensureFavorite(type,id,on){
  var obj=type==='shortcut'?getShortcut(id):getGroup(id);
  if(!obj)return;
  obj.favorite=!!on;
  var ref=entityRef(type,id);
  state.favoriteOrder=state.favoriteOrder.filter(function(x){return x!==ref;});
  if(on)state.favoriteOrder.push(ref);
}

var state=loadState();
state.ui=state.ui||{};
state.ui.shortcutsOpen=false;
state.ui.groupsOpen=false;
var formMode=null;
var editingId=null;
var formAnchor='';
var formBaseline='';
var selectedIcon='Rocket';
var favoriteChoice=false;
var selectedRelations=new Set();
var submitLocked=false;
var drag=null;

var statusText=document.getElementById('statusText');
var panel=document.getElementById('panel');
var panelTitle=document.getElementById('panelTitle');
var starBtn=document.getElementById('starBtn');
var closePanelBtn=document.getElementById('closePanel');
var nameInput=document.getElementById('nameInput');
var urlInput=document.getElementById('urlInput');
var shortcutFields=document.getElementById('shortcutFields');
var groupFields=document.getElementById('groupFields');
var iconGrid=document.getElementById('iconGrid');
var groupsToggle=document.getElementById('groupsToggle');
var groupsOptions=document.getElementById('groupsOptions');
var groupsCount=document.getElementById('groupsCount');
var shortcutsToggle=document.getElementById('shortcutsToggle');
var shortcutsOptions=document.getElementById('shortcutsOptions');
var shortcutsCount=document.getElementById('shortcutsCount');
var submitBtn=document.getElementById('submitBtn');
var deleteBtn=document.getElementById('deleteBtn');
var topFormSlot=document.getElementById('topFormSlot');
var openShortcutBtn=document.getElementById('openShortcutForm');
var openGroupBtn=document.getElementById('openGroupForm');
var shortcutsBay=document.getElementById('shortcutsBay');
var groupsBay=document.getElementById('groupsBay');
var allShortcutsList=document.getElementById('allShortcutsList');
var allGroupsList=document.getElementById('allGroupsList');
var favoritesBay=document.getElementById('favoritesBay');

function setFavoriteChoice(v){
  favoriteChoice=!!v;
  starBtn.textContent=favoriteChoice?'★':'☆';
  starBtn.classList.toggle('on',favoriteChoice);
}
function renderIconGrid(){
  iconGrid.innerHTML=ICON_KEYS.map(function(k){
    return '<button type="button" data-icon="'+esc(k)+'" class="'+(k===selectedIcon?'sel':'')+'">'+svgIcon(k,18)+'</button>';
  }).join('');
  iconGrid.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click',function(){selectedIcon=btn.dataset.icon;renderIconGrid();});
  });
}
function renderRelationOptions(){
  groupsCount.textContent=String(selectedRelations.size);
  shortcutsCount.textContent=String(selectedRelations.size);
  if(formMode==='shortcut'){
    if(!state.groups.length){
      groupsOptions.innerHTML='<div class="relEmpty">Nenhum grupo cadastrado</div>';
    }else{
      groupsOptions.innerHTML=state.groups.map(function(g){
        return '<label class="relOption '+(selectedRelations.has(g.id)?'selected':'')+'"><input type="checkbox" value="'+esc(g.id)+'" '+(selectedRelations.has(g.id)?'checked':'')+'><span>'+esc(displayName(g.name))+'</span></label>';
      }).join('');
      groupsOptions.querySelectorAll('input').forEach(function(input){
        input.addEventListener('change',function(){
          if(input.checked)selectedRelations.add(input.value);else selectedRelations.delete(input.value);
          renderRelationOptions();
        });
      });
    }
  }else if(formMode==='group'){
    if(!state.shortcuts.length){
      shortcutsOptions.innerHTML='<div class="relEmpty">Nenhum atalho cadastrado</div>';
    }else{
      shortcutsOptions.innerHTML=state.shortcuts.map(function(s){
        return '<label class="relOption '+(selectedRelations.has(s.id)?'selected':'')+'"><input type="checkbox" value="'+esc(s.id)+'" '+(selectedRelations.has(s.id)?'checked':'')+'><span>'+esc(displayName(s.name))+'</span></label>';
      }).join('');
      shortcutsOptions.querySelectorAll('input').forEach(function(input){
        input.addEventListener('change',function(){
          if(input.checked)selectedRelations.add(input.value);else selectedRelations.delete(input.value);
          renderRelationOptions();
        });
      });
    }
  }
}
function formSnapshot(){
  return JSON.stringify({
    mode:formMode||'',id:editingId||'',name:nameInput.value,
    url:formMode==='shortcut'?urlInput.value:'',icon:formMode==='shortcut'?selectedIcon:'',
    favorite:favoriteChoice,relations:Array.from(selectedRelations).sort()
  });
}
function captureBaseline(){formBaseline=formSnapshot();}
function formIsDirty(){return panel.style.display!=='none'&&formSnapshot()!==formBaseline;}
function parkPanel(){
  panel.style.display='none';
  document.body.appendChild(panel);
  openShortcutBtn.classList.remove('active');
  openGroupBtn.classList.remove('active');
}
function closePanelNow(){
  parkPanel();
  formMode=null;editingId=null;formAnchor='';formBaseline='';selectedRelations=new Set();submitLocked=false;
}
function requestClosePanel(after){
  var finish=function(){closePanelNow();if(after)after();};
  if(!formIsDirty()){finish();return;}
  showConfirmBox('Descartar as alterações preenchidas?','SIM, DESCARTAR','CONTINUAR EDITANDO',finish);
}
function placePanelTop(kind){
  topFormSlot.appendChild(panel);
  panel.style.display='block';
  openShortcutBtn.classList.toggle('active',kind==='shortcut');
  openGroupBtn.classList.toggle('active',kind==='group');
}
function placePanelIn(slot){
  slot.appendChild(panel);
  panel.style.display='block';
  openShortcutBtn.classList.remove('active');
  openGroupBtn.classList.remove('active');
}
function openShortcutForm(groupId,shortcutId,slot){
  formMode='shortcut';editingId=shortcutId||null;submitLocked=false;
  shortcutFields.style.display='block';groupFields.style.display='none';
  groupsOptions.hidden=true;shortcutsOptions.hidden=true;
  var item=editingId?getShortcut(editingId):null;

  if(slot){formAnchor='inline';placePanelIn(slot);}
  else{formAnchor=editingId?'inline':'top-shortcut';placePanelTop('shortcut');}

  panelTitle.textContent=item?'EDITAR ATALHO':'NOVO ATALHO';
  nameInput.value=item?item.name:'';
  urlInput.value=item?item.url:'';
  selectedIcon=item?item.icon:'Rocket';
  setFavoriteChoice(item?item.favorite:false);
  selectedRelations=new Set(item?groupIdsForShortcut(item.id):(groupId?[groupId]:[]));
  renderIconGrid();renderRelationOptions();
  deleteBtn.style.display=item?'block':'none';
  deleteBtn.textContent='EXCLUIR ESTE ATALHO';
  submitBtn.textContent=item?'SALVAR ALTERAÇÕES':'SALVAR ATALHO';
  captureBaseline();
}
function openGroupForm(groupId,slot){
  formMode='group';editingId=groupId||null;submitLocked=false;
  shortcutFields.style.display='none';groupFields.style.display='block';
  groupsOptions.hidden=true;shortcutsOptions.hidden=true;
  var group=editingId?getGroup(editingId):null;

  if(slot){formAnchor='inline';placePanelIn(slot);}
  else{formAnchor=editingId?'inline':'top-group';placePanelTop('group');}

  panelTitle.textContent=group?'EDITAR GRUPO':'NOVO GRUPO';
  nameInput.value=group?group.name:'';
  urlInput.value='';
  setFavoriteChoice(group?group.favorite:false);
  selectedRelations=new Set(group?group.shortcutIds:[]);
  renderRelationOptions();
  deleteBtn.style.display=group?'block':'none';
  deleteBtn.textContent='EXCLUIR ESTE GRUPO';
  submitBtn.textContent=group?'SALVAR ALTERAÇÕES':'SALVAR GRUPO';
  captureBaseline();
}
function saveForm(){
  if(submitLocked)return;
  submitLocked=true;
  if(formMode==='shortcut'){
    var s=editingId?getShortcut(editingId):null;
    if(!s){
      s={id:uid(),name:'',url:'',icon:'Rocket',favorite:false};
      state.shortcuts.push(s);
      editingId=s.id;
    }
    s.name=nameInput.value.trim();
    s.url=urlInput.value.trim();
    s.icon=selectedIcon||'Rocket';
    ensureFavorite('shortcut',s.id,favoriteChoice);
    setGroupsForShortcut(s.id,selectedRelations);
  }else if(formMode==='group'){
    var g=editingId?getGroup(editingId):null;
    if(!g){
      g={id:uid(),name:'',favorite:false,open:false,shortcutIds:[]};
      state.groups.push(g);
      editingId=g.id;
    }
    g.name=nameInput.value.trim();
    g.shortcutIds=Array.from(selectedRelations).filter(function(id){return !!getShortcut(id);});
    ensureFavorite('group',g.id,favoriteChoice);
  }
  saveState();closePanelNow();render();
}
function deleteShortcut(id){
  state.shortcuts=state.shortcuts.filter(function(s){return s.id!==id;});
  state.groups.forEach(function(g){g.shortcutIds=g.shortcutIds.filter(function(x){return x!==id;});});
  state.favoriteOrder=state.favoriteOrder.filter(function(ref){return ref!=='s:'+id;});
}
function deleteGroup(id){
  state.groups=state.groups.filter(function(g){return g.id!==id;});
  state.favoriteOrder=state.favoriteOrder.filter(function(ref){return ref!=='g:'+id;});
}
function showConfirmBox(message,yesText,noText,onYes){
  var overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML='<div class="modalBox"><div class="modalTitle">'+esc(message)+'</div><div class="confirmActions"><button class="modalBtn danger" id="yesBtn" type="button">'+esc(yesText)+'</button><button class="modalBtn" id="noBtn" type="button">'+esc(noText)+'</button></div></div>';
  document.body.appendChild(overlay);
  function close(){overlay.remove();}
  overlay.querySelector('#noBtn').addEventListener('click',close);
  overlay.querySelector('#yesBtn').addEventListener('click',function(){close();onYes();});
}
function confirmDeleteCurrent(){
  if(!editingId)return;
  if(formMode==='shortcut'){
    var s=getShortcut(editingId);if(!s)return;
    showConfirmBox('Excluir "'+displayName(s.name)+'"?','SIM, EXCLUIR','CANCELAR',function(){
      deleteShortcut(s.id);saveState();closePanelNow();render();
    });
  }else{
    var g=getGroup(editingId);if(!g)return;
    showConfirmBox('Excluir "'+displayName(g.name)+'"?','SIM, EXCLUIR','CANCELAR',function(){
      deleteGroup(g.id);saveState();closePanelNow();render();
    });
  }
}

function shortcutRowHtml(s,context,groupId){
  var url=openableUrl(s.url);
  return '<div class="itemRow shortcut" data-kind="shortcut" data-id="'+esc(s.id)+'" data-context="'+esc(context)+'" '+(groupId?'data-group-id="'+esc(groupId)+'"':'')+'>'+
    '<div class="itemMain">'+
      '<button class="itemTextBtn" type="button" data-action="edit-shortcut" data-id="'+esc(s.id)+'">'+
        '<span class="itemKind">ATALHO</span><span class="itemTitle">'+esc(displayName(s.name))+'</span>'+
      '</button>'+
      '<button class="itemAction" type="button" data-action="open-link" data-id="'+esc(s.id)+'" '+(url?'':'disabled')+'>ABRIR</button>'+
    '</div>'+
    '<div class="inlineEditSlot"></div>'+
  '</div>';
}
function groupRowHtml(g,context){
  var children=g.shortcutIds.map(getShortcut).filter(Boolean);
  return '<div class="itemRow group '+(g.open?'open':'')+'" data-kind="group" data-id="'+esc(g.id)+'" data-context="'+esc(context)+'">'+
    '<div class="itemMain">'+
      '<button class="groupPlus" type="button" data-action="new-shortcut-in-group" data-id="'+esc(g.id)+'">+</button>'+
      '<button class="itemTextBtn" type="button" data-action="toggle-group" data-id="'+esc(g.id)+'">'+
        '<span class="itemKind">GRUPO</span><span class="itemTitle">'+esc(displayName(g.name))+'</span>'+
      '</button>'+
      '<button class="itemAction" type="button" data-action="toggle-group" data-id="'+esc(g.id)+'">'+(g.open?'FECHAR':'ABRIR')+'</button>'+
    '</div>'+
    '<div class="groupChildren">'+
      '<div class="itemList">'+(children.length?children.map(function(s){return shortcutRowHtml(s,'group',g.id);}).join(''):'<div class="relEmpty">Nenhum atalho neste grupo</div>')+'</div>'+
      '<div class="inlineEditSlot groupSlot"></div>'+
      '<div class="groupManage"><button class="groupEditBtn" type="button" data-action="edit-group" data-id="'+esc(g.id)+'">EDITAR</button></div>'+
    '</div>'+
  '</div>';
}
function favoriteHtml(ref){
  if(ref.indexOf('s:')===0){
    var s=getShortcut(ref.slice(2));return s?shortcutRowHtml(s,'favorites',''):'';
  }
  var g=getGroup(ref.slice(2));return g?groupRowHtml(g,'favorites'):'';
}

function render(){
  shortcutsBay.classList.toggle('open',!!state.ui.shortcutsOpen);
  groupsBay.classList.toggle('open',!!state.ui.groupsOpen);

  allShortcutsList.innerHTML=state.shortcuts.length
    ?state.shortcuts.map(function(s){return shortcutRowHtml(s,'all-shortcuts','');}).join('')
    :'<div class="relEmpty">Nenhum atalho cadastrado</div>';

  allGroupsList.innerHTML=state.groups.length
    ?state.groups.map(function(g){return groupRowHtml(g,'all-groups');}).join('')
    :'<div class="relEmpty">Nenhum grupo cadastrado</div>';

  var refs=[];
  state.favoriteOrder.forEach(function(ref){
    if(ref.indexOf('s:')===0){var s=getShortcut(ref.slice(2));if(s&&s.favorite)refs.push(ref);}
    else{var g=getGroup(ref.slice(2));if(g&&g.favorite)refs.push(ref);}
  });
  state.shortcuts.forEach(function(s){var r='s:'+s.id;if(s.favorite&&refs.indexOf(r)===-1)refs.push(r);});
  state.groups.forEach(function(g){var r='g:'+g.id;if(g.favorite&&refs.indexOf(r)===-1)refs.push(r);});
  state.favoriteOrder=refs;
  favoritesBay.innerHTML=refs.length?'<div class="itemList">'+refs.map(favoriteHtml).join('')+'</div>':'';

  wireActions();
  statusText.textContent='LOCAL';
}

function toggleGroupById(id){
  var g=getGroup(id);if(!g)return;
  g.open=!g.open;saveState();render();
}
function openGroupFromFavorite(id){
  var g=getGroup(id);if(!g)return;
  g.open=true;state.ui.groupsOpen=true;saveState();render();
  requestAnimationFrame(function(){
    var el=allGroupsList.querySelector('[data-kind="group"][data-id="'+CSS.escape(id)+'"]');
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  });
}

function wireActions(){
  document.querySelectorAll('[data-action="open-link"]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var s=getShortcut(btn.dataset.id);if(!s)return;
      var url=openableUrl(s.url);if(url)window.open(url,'_blank','noopener,noreferrer');
    });
  });
  document.querySelectorAll('[data-action="edit-shortcut"]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var row=btn.closest('.itemRow');
      var slot=row.querySelector('.inlineEditSlot');
      var go=function(){openShortcutForm(row.dataset.groupId||null,btn.dataset.id,slot);};
      if(panel.style.display!=='none')requestClosePanel(go);else go();
    });
  });
  document.querySelectorAll('[data-action="toggle-group"]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var row=btn.closest('.itemRow.group');
      if(row&&row.dataset.context==='favorites'){
        openGroupFromFavorite(btn.dataset.id);
      }else{
        toggleGroupById(btn.dataset.id);
      }
    });
  });
  document.querySelectorAll('[data-action="edit-group"]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var row=btn.closest('.itemRow.group');
      var slot=row.querySelector('.groupSlot');
      var go=function(){openGroupForm(btn.dataset.id,slot);};
      if(panel.style.display!=='none')requestClosePanel(go);else go();
    });
  });
  document.querySelectorAll('[data-action="new-shortcut-in-group"]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var row=btn.closest('.itemRow.group');
      var slot=row.querySelector('.groupSlot');
      var go=function(){openShortcutForm(btn.dataset.id,null,slot);};
      if(panel.style.display!=='none')requestClosePanel(go);else go();
    });
  });
  document.querySelectorAll('.itemRow[data-kind="shortcut"]').forEach(function(row){
    row.addEventListener('pointerdown',onDragPointerDown);
  });
  document.querySelectorAll('.itemRow[data-kind="group"]').forEach(function(row){
    row.addEventListener('pointerdown',onDragPointerDown);
  });
}

function canDragRow(row,e){
  if(e.button!==undefined&&e.button!==0)return false;
  if(e.target.closest&&e.target.closest('.itemAction,.groupPlus,.groupManage,.inlineEditSlot'))return false;
  return true;
}
function onDragPointerDown(e){
  var row=e.currentTarget;
  if(!canDragRow(row,e))return;
  drag={
    row:row,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,active:false,clone:null,
    timer:setTimeout(function(){activateDrag(row);},LONG_PRESS_MS)
  };
  document.addEventListener('pointermove',onDragMove,{passive:false});
  document.addEventListener('pointerup',onDragEnd);
  document.addEventListener('pointercancel',onDragEnd);
}
function activateDrag(row){
  if(!drag||drag.row!==row)return;
  drag.active=true;
  var r=row.getBoundingClientRect();
  var clone=row.cloneNode(true);
  clone.classList.add('dragGhost');
  clone.style.left=r.left+'px';clone.style.top=r.top+'px';clone.style.width=r.width+'px';clone.style.height=r.height+'px';
  document.body.appendChild(clone);
  row.classList.add('dragHidden');
  drag.clone=clone;
  try{row.setPointerCapture(drag.pointerId);}catch(e){}
}
function onDragMove(e){
  if(!drag||e.pointerId!==drag.pointerId)return;
  var dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
  if(!drag.active){
    if(Math.hypot(dx,dy)>9)clearTimeout(drag.timer);
    return;
  }
  e.preventDefault();
  drag.clone.style.transform='translate('+dx+'px,'+dy+'px)';
  var under=document.elementFromPoint(e.clientX,e.clientY);
  var target=under&&under.closest?under.closest('.itemRow:not(.dragGhost)'):null;
  if(!target||target===drag.row)return;
  if(target.dataset.kind!==drag.row.dataset.kind)return;
  if(target.dataset.context!==drag.row.dataset.context)return;
  if((target.dataset.groupId||'')!==(drag.row.dataset.groupId||''))return;
  if(target.parentNode!==drag.row.parentNode)return;
  var items=Array.from(drag.row.parentNode.children).filter(function(el){return el.classList&&el.classList.contains('itemRow');});
  var a=items.indexOf(drag.row),b=items.indexOf(target);
  if(a<b)drag.row.parentNode.insertBefore(drag.row,target.nextSibling);
  else drag.row.parentNode.insertBefore(drag.row,target);
}
function onDragEnd(e){
  if(!drag||e.pointerId!==drag.pointerId)return;
  clearTimeout(drag.timer);
  document.removeEventListener('pointermove',onDragMove);
  document.removeEventListener('pointerup',onDragEnd);
  document.removeEventListener('pointercancel',onDragEnd);
  var d=drag;drag=null;
  if(d.clone)d.clone.remove();
  d.row.classList.remove('dragHidden');
  if(!d.active)return;

  var ordered=Array.from(d.row.parentNode.children).filter(function(el){return el.classList&&el.classList.contains('itemRow');});
  if(d.row.dataset.context==='all-shortcuts'){
    var mapS=new Map(state.shortcuts.map(function(s){return [s.id,s];}));
    state.shortcuts=ordered.map(function(el){return mapS.get(el.dataset.id);}).filter(Boolean);
  }else if(d.row.dataset.context==='all-groups'){
    var mapG=new Map(state.groups.map(function(g){return [g.id,g];}));
    state.groups=ordered.map(function(el){return mapG.get(el.dataset.id);}).filter(Boolean);
  }else if(d.row.dataset.context==='favorites'){
    state.favoriteOrder=ordered.map(function(el){return (el.dataset.kind==='shortcut'?'s:':'g:')+el.dataset.id;});
  }else if(d.row.dataset.context==='group'){
    var g=getGroup(d.row.dataset.groupId);
    if(g)g.shortcutIds=ordered.map(function(el){return el.dataset.id;});
  }
  saveState();render();
}

openShortcutBtn.addEventListener('click',function(){
  if(panel.style.display!=='none'&&formAnchor==='top-shortcut'){requestClosePanel();return;}
  var go=function(){openShortcutForm(null,null,null);};
  if(panel.style.display!=='none')requestClosePanel(go);else go();
});
openGroupBtn.addEventListener('click',function(){
  if(panel.style.display!=='none'&&formAnchor==='top-group'){requestClosePanel();return;}
  var go=function(){openGroupForm(null,null);};
  if(panel.style.display!=='none')requestClosePanel(go);else go();
});
closePanelBtn.addEventListener('click',function(){requestClosePanel();});
starBtn.addEventListener('click',function(){setFavoriteChoice(!favoriteChoice);});
submitBtn.addEventListener('click',saveForm);
deleteBtn.addEventListener('click',confirmDeleteCurrent);
groupsToggle.addEventListener('click',function(){groupsOptions.hidden=!groupsOptions.hidden;if(!groupsOptions.hidden)renderRelationOptions();});
shortcutsToggle.addEventListener('click',function(){shortcutsOptions.hidden=!shortcutsOptions.hidden;if(!shortcutsOptions.hidden)renderRelationOptions();});

document.getElementById('shortcutsBayToggle').addEventListener('click',function(){
  state.ui.shortcutsOpen=!state.ui.shortcutsOpen;saveState();render();
});
document.getElementById('groupsBayToggle').addEventListener('click',function(){
  state.ui.groupsOpen=!state.ui.groupsOpen;saveState();render();
});

renderIconGrid();
render();
</script>
