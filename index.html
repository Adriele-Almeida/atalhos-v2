<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Hub">
<title>Meu Hub</title>
<style>
:root{
  --bg:#070E1E;--panel:#0D1B33;--card1:#234876;--card2:#1A365D;--border:#1E3D6B;
  --accent:#00F5FF;--text:#E8F0FF;--muted:#5E82A8;--muted2:#7DA0C9;--danger:#FF2D55;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  background-image:radial-gradient(90% 70% at 50% 0%,#1E3D6B 0%,#132A4C 25%,#0D1B33 55%,#070E1E 85%);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 40px}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:rgba(13,27,51,.8);
  border-radius:999px;padding:6px 14px;font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--muted2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
h1{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:16px 0 4px;line-height:.9}
h1 span.hub{color:var(--accent)}
.tag{color:var(--muted2);font-size:12px;letter-spacing:.05em;margin:8px 0 22px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
button{font-family:inherit;cursor:pointer}
.editbtn{border:1px solid var(--border);background:var(--panel);color:#A8C4E5;border-radius:999px;
  padding:10px 18px;font-size:12px;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.editbtn.on{border-color:var(--accent);background:var(--accent);color:var(--bg)}
.addbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#1C3A68,#132A4C);
  border:1px solid var(--border);border-radius:20px;padding:16px 18px;color:#fff;margin-bottom:22px}
.addbtn .l{display:flex;align-items:center;gap:14px}
.addbtn .ic{width:44px;height:44px;border-radius:14px;background:linear-gradient(#244B80,#1A365D);display:grid;place-items:center;border:1px solid rgba(0,245,255,.2)}
.addbtn .name{font-size:14px;font-weight:700}
.addbtn .sub{font-size:11px;color:#7FA7D0;text-transform:uppercase;margin-top:2px}
.panel{border:1px solid var(--border);background:rgba(13,27,51,.9);border-radius:24px;padding:22px;margin-bottom:22px}
.panel h2{font-size:12px;letter-spacing:.15em;margin:0}
.panel .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.x{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:#6A8AB0;display:grid;place-items:center}
label{display:block;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input[type=text],input[type=url]{width:100%;height:50px;border-radius:14px;border:1px solid var(--border);background:var(--bg);
  color:#fff;padding:0 14px;font-size:14px;outline:none;margin-bottom:16px}
input:focus{border-color:var(--accent)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;border:1px solid var(--border);background:var(--bg);border-radius:14px;padding:10px;margin-bottom:18px}
.icons button{aspect-ratio:1;border-radius:12px;border:1px solid #1A365D;background:#132A4C;color:#6A8CB3;display:grid;place-items:center}
.icons button.sel{border-color:var(--accent);background:var(--accent);color:var(--bg)}
.submit{width:100%;height:50px;border-radius:14px;border:1px solid rgba(0,245,255,.3);background:linear-gradient(#00D1FF,#00A6CC);
  color:#06131F;font-weight:800;letter-spacing:.1em;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.submit:disabled{opacity:.35}
.delLink{width:100%;text-align:center;margin-top:12px;background:none;border:none;color:#ff9fae;font-size:12px;font-weight:700;letter-spacing:.08em;padding:8px}
.count{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--muted);margin-bottom:14px}
.count .ln{width:20px;height:1px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{position:relative}
.card.editing{touch-action:none;user-select:none;-webkit-user-select:none}
.card.hidden-drag{visibility:hidden}
.dragClone{position:fixed;z-index:999;pointer-events:none;border-radius:22px}
.dragClone .cardInner{box-shadow:0 24px 40px rgba(0,0,0,.6);border-color:var(--accent)}
.card a,.card .cardInner{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;border-radius:22px;
  border:1px solid rgba(30,61,107,.8);background:linear-gradient(160deg,var(--card1),#1E3D6B 60%,var(--card2));
  padding:10px;text-decoration:none;color:inherit;box-shadow:0 12px 24px rgba(0,0,0,.4)}
.card.editing:not(.hidden-drag) .cardInner{animation:wiggle .32s ease-in-out infinite;border-color:#2A4F82}
@keyframes wiggle{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
.card .icwrap{width:52px;height:52px;border-radius:16px;border:1px solid rgba(42,79,130,.7);background:linear-gradient(#0D1B33,#070E1E);
  display:grid;place-items:center;color:#C7DCF5}
.card .nm{margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.05em;text-align:center;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grip{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:var(--bg);display:grid;place-items:center;pointer-events:none;z-index:2;box-shadow:0 0 10px rgba(0,245,255,.6)}
.empty{text-align:center;padding:60px 20px;border:1px dashed rgba(30,61,107,.6);border-radius:26px;color:var(--muted2)}
.hint{text-align:center;font-size:10px;letter-spacing:.1em;color:#3E5E82;text-transform:uppercase;margin-top:20px}
footer{margin-top:36px;border:1px solid var(--border);border-radius:22px;background:rgba(13,27,51,.7);overflow:hidden}
footer .head{padding:10px 18px;background:rgba(7,14,30,.6);border-bottom:1px solid #132A4C;font-size:10px;font-weight:700;
  letter-spacing:.15em;color:var(--muted)}
footer .body{padding:18px}
footer p{margin:0;font-size:11px;line-height:1.5;color:#7FA7D0}
.status{margin-top:14px;display:flex;align-items:center;gap:10px;border:1px solid #132A4C;background:var(--bg);
  border-radius:12px;padding:10px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#4A6E92}
.sdot{width:6px;height:6px;border-radius:50%;background:#34D399;box-shadow:0 0 8px rgba(52,211,153,.7)}
.sdot.off{background:#F5B942;box-shadow:0 0 8px rgba(245,185,66,.6)}
.overlay{position:fixed;inset:0;background:rgba(3,8,18,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:300;padding:24px}
.modalBox{width:100%;max-width:300px;background:linear-gradient(#132A4C,#0D1B33);border:1px solid var(--border);border-radius:22px;padding:24px;text-align:center}
.modalMsg{font-size:13px;line-height:1.5;margin-bottom:18px;color:#DCE9FB}
.modalBtn{width:100%;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-weight:700;font-size:13px;letter-spacing:.05em;margin-bottom:10px}
.modalBtn.danger{background:rgba(80,10,25,.5);border-color:#7a1f2f;color:#ff9fae}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <div class="toprow">
    <div>
      <span class="badge"><span class="dot"></span>MEU HUB <span id="statusText">•</span></span>
      <h1>MEU <span class="hub">HUB</span></h1>
      <div class="tag">Painel de atalhos pessoal</div>
    </div>
    <button class="editbtn" id="editToggle">EDITAR</button>
  </div>

  <button class="addbtn" id="openForm">
    <span class="l">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></span>
      <span><span class="name" id="formTitleBtn">NOVO ATALHO</span><div class="sub">Nome + link + ícone</div></span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div class="panel" id="panel" style="display:none">
    <div class="top">
      <div></div>
      <button class="x" id="closePanel"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <label>Nome</label>
    <input type="text" id="nameInput">
    <label>Link</label>
    <input type="url" id="urlInput">
    <label>Ícone</label>
    <div class="icons" id="iconGrid"></div>
    <button class="submit" id="submitBtn" disabled></button>
    <button class="delLink" id="deleteBtn" style="display:none">EXCLUIR ESTE ATALHO</button>
  </div>

  <div class="count">
    <span class="ln"></span><span id="countText">0 atalhos</span>
  </div>

  <div id="listArea"></div>
</div>

<script>
const LS_KEY = "linkhub_v1";
const ICONS = {
  Rocket:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>',
  Globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  Briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  FolderKanban:'<path d="M4 20V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>',
  Palette:'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1 0 1.7-.8 1.7-1.7 0-.9-.7-1.6-.7-2.5A1.7 1.7 0 0 1 14.6 16h2c3 0 5.4-2.5 5.4-5.5C22 5.6 17.5 2 12 2z"/>',
  FileText:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/>',
  Target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  LayoutGrid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  MessageSquare:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  Music2:'<circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/>',
  ShoppingBag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  BookOpen:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  Compass:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.65-5.65 1.8 1.8-5.65z"/>',
  Zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  Layers:'<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m2 12 8.6 3.91a2 2 0 0 0 1.65 0L22 12M2 17l8.6 3.91a2 2 0 0 0 1.65 0L22 17"/>',
  Monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  Box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>'
};
const ICON_KEYS = Object.keys(ICONS);
const LEGACY = {"🎨":"Palette","📁":"FolderKanban","📝":"FileText","🎯":"Target","🚀":"Rocket","💼":"Briefcase","💬":"MessageSquare","🎵":"Music2","🛒":"ShoppingBag","📚":"BookOpen"};
const DEFAULTS = [
  {id:"1",name:"Canva",url:"https://canva.com",icon:"Palette"},
  {id:"2",name:"Drive",url:"https://drive.google.com",icon:"FolderKanban"},
  {id:"3",name:"Notion",url:"https://notion.so",icon:"FileText"},
  {id:"4",name:"Figma",url:"https://figma.com",icon:"Target"}
];
const GRIP = '<svg width="13" height="13" viewBox="0 0 24 24"><path d="M21.17 6.81a1 1 0 0 0 0-3.99 1 1 0 0 0-.71.29L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></svg>';

function svgIcon(name, w=26){ return `<svg width="${w}" height="${w}" viewBox="0 0 24 24">${ICONS[name]||ICONS.Box}</svg>`; }
function normalizeUrl(v){ let t=(v||"").trim(); if(!t) return ""; if(!/^https?:\/\//i.test(t)) t="https://"+t; try{ new URL(t); return t; }catch{ return ""; } }
function migrate(arr){
  return arr.map(s=>{
    if(s.icon) return s;
    return {...s, icon: (s.emoji && LEGACY[s.emoji]) || "Box"};
  });
}

// ---- storage layer: Supabase sync across devices + localStorage fallback ----
const SUPABASE_URL = "https://uptzkgvfdycxlqnsgokl.supabase.co";
const SUPABASE_KEY = "sb_publishable_9mJj4mF2-IJ5Y5WlSIkp7A_G9a9-f5e";
const SUPABASE_TABLE = "atalhos_hub_state";
const CLOUD_ID = "main";
let cloudReady = false;

async function cloudRequest(query, options={}){
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}${query}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if(!response.ok) throw new Error(`Supabase ${response.status}`);
  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

async function initStorage(){
  const st = document.getElementById("statusText");
  try{
    const rows = await cloudRequest(`?id=eq.${CLOUD_ID}&select=id`);
    cloudReady = Array.isArray(rows);
  }catch(e){
    cloudReady = false;
  }
  st.textContent = cloudReady ? "SYNC" : "LOCAL";
}

function readLocalShortcuts(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const value = JSON.parse(raw);
      if(Array.isArray(value) && value.length) return migrate(value);
    }
  }catch(e){}
  return null;
}

async function loadShortcuts(){
  const local = readLocalShortcuts();

  if(cloudReady){
    try{
      const rows = await cloudRequest(`?id=eq.${CLOUD_ID}&select=items`);
      const cloudItems = rows && rows[0] && rows[0].items;

      if(Array.isArray(cloudItems) && cloudItems.length){
        const synced = migrate(cloudItems);
        try{ localStorage.setItem(LS_KEY, JSON.stringify(synced)); }catch(e){}
        return synced;
      }

      if(local && local.length){
        await saveShortcuts(local);
        return local;
      }
    }catch(e){}
  }

  return local || DEFAULTS;
}

async function saveShortcuts(list){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); }catch(e){}

  if(cloudReady){
    try{
      await cloudRequest("?on_conflict=id", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({
          id: CLOUD_ID,
          items: list,
          updated_at: new Date().toISOString()
        })
      });
    }catch(e){}
  }
}

// ---- state ----
let items = [];
let editMode = false;
let selectedIcon = "Rocket";
let editingId = null;
let dragState = null;

const panel = document.getElementById("panel");
const nameInput = document.getElementById("nameInput");
const urlInput = document.getElementById("urlInput");
const submitBtn = document.getElementById("submitBtn");
const iconGrid = document.getElementById("iconGrid");
const listArea = document.getElementById("listArea");
const countText = document.getElementById("countText");
const editToggle = document.getElementById("editToggle");
const deleteBtn = document.getElementById("deleteBtn");

function renderIconGrid(){
  iconGrid.innerHTML = ICON_KEYS.map(k=>`<button type="button" data-icon="${k}" class="${k===selectedIcon?'sel':''}">${svgIcon(k,18)}</button>`).join("");
  iconGrid.querySelectorAll("button").forEach(b=>b.onclick=()=>{ selectedIcon=b.dataset.icon; renderIconGrid(); });
}
function validate(){
  submitBtn.disabled = !(nameInput.value.trim().length>0 && normalizeUrl(urlInput.value).length>0);
}
function openPanel(edit){
  if(edit){
    submitBtn.textContent = "SALVAR ALTERAÇÕES";
    deleteBtn.style.display = "block";
  } else {
    editingId = null;
    nameInput.value=""; urlInput.value=""; selectedIcon="Rocket";
    submitBtn.textContent = "ADICIONAR ATALHO";
    deleteBtn.style.display = "none";
    renderIconGrid();
  }
  panel.style.display="block";
  document.getElementById("openForm").style.display="none";
  validate();
}
function closePanel(){
  panel.style.display="none";
  document.getElementById("openForm").style.display="flex";
  editingId=null;
}
document.getElementById("openForm").onclick=()=>openPanel(false);
document.getElementById("closePanel").onclick=closePanel;
nameInput.oninput=validate; urlInput.oninput=validate;

submitBtn.onclick=async ()=>{
  const url = normalizeUrl(urlInput.value);
  const name = nameInput.value.trim();
  if(!name||!url) return;
  if(editingId){
    items = items.map(s=> s.id===editingId ? {...s, name, url, icon:selectedIcon} : s);
  } else {
    items = [{id:Date.now().toString(), name, url, icon:selectedIcon}, ...items];
  }
  await saveShortcuts(items);
  closePanel();
  render();
};

editToggle.onclick=()=>{ cleanupStuckDrag(); dragState=null; editMode=!editMode; editToggle.classList.toggle("on",editMode); editToggle.textContent = editMode?"FEITO":"EDITAR"; render(); };

deleteBtn.onclick=async ()=>{
  if(!editingId) return;
  const s = items.find(x=>x.id===editingId);
  if(!s) return;
  const ok = await showConfirm(`Excluir "${s.name.replace(/</g,"&lt;")}"? Essa ação não pode ser desfeita.`);
  if(ok){
    await removeItem(editingId);
    closePanel();
  }
};

function showConfirm(msg){
  return new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="modalBox"><div class="modalMsg">${msg}</div>
      <button class="modalBtn danger" id="cYes">Sim, excluir</button>
      <button class="modalBtn" id="cNo">Cancelar</button></div>`;
    document.body.appendChild(overlay);
    const done=(v)=>{ overlay.remove(); resolve(v); };
    overlay.addEventListener("click", e=>{ if(e.target===overlay) done(false); });
    overlay.querySelector("#cYes").onclick=()=>done(true);
    overlay.querySelector("#cNo").onclick=()=>done(false);
  });
}

function startEdit(id){
  const s = items.find(x=>x.id===id);
  if(!s) return;
  editingId=id;
  nameInput.value=s.name; urlInput.value=s.url; selectedIcon=s.icon;
  renderIconGrid();
  openPanel(true);
}
async function removeItem(id){
  items = items.filter(s=>s.id!==id);
  await saveShortcuts(items);
  render();
}

// ---- Arrastar para reordenar: clone flutuante segue o dedo 1:1, vizinhos deslizam suavemente ----
// Os listeners ficam no document (não no card) porque mover o próprio elemento
// capturado dentro da grade, no meio do arraste, quebra o rastreamento do toque no iOS.
function cleanupStuckDrag(){
  document.querySelectorAll(".dragClone").forEach(c=>c.remove());
  document.querySelectorAll(".card.hidden-drag").forEach(c=>c.classList.remove("hidden-drag"));
}

function flipReorder(container, hiddenEl, moveFn){
  const firstRects = new Map();
  [...container.children].forEach(c=>{ if(c!==hiddenEl) firstRects.set(c, c.getBoundingClientRect()); });
  moveFn();
  [...container.children].forEach(c=>{
    if(c===hiddenEl) return;
    const first = firstRects.get(c);
    if(!first) return;
    const last = c.getBoundingClientRect();
    const dx = first.left-last.left, dy = first.top-last.top;
    if(dx || dy){
      c.style.pointerEvents = "none"; // não pode virar alvo de troca enquanto desliza
      c.style.transition = "none";
      c.style.transform = `translate(${dx}px,${dy}px)`;
      requestAnimationFrame(()=>{
        c.style.transition = "transform .22s ease";
        c.style.transform = "";
      });
      const release = ()=>{ c.style.pointerEvents=""; c.removeEventListener("transitionend", release); };
      c.addEventListener("transitionend", release);
      setTimeout(release, 280);
    }
  });
}

function onCardPointerDown(e){
  if(!editMode) return;
  cleanupStuckDrag();
  const card = e.currentTarget;
  dragState = {
    id: card.dataset.id, card, pointerId: e.pointerId,
    startX: e.clientX, startY: e.clientY, moved: false, clone: null
  };
  document.addEventListener("pointermove", onDocPointerMove);
  document.addEventListener("pointerup", onDocPointerUp);
  document.addEventListener("pointercancel", onDocPointerUp);
}
function beginDrag(){
  const { card } = dragState;
  const rect = card.getBoundingClientRect();
  dragState.moved = true;
  const clone = card.cloneNode(true);
  clone.className = "card dragClone";
  clone.style.left = rect.left+"px";
  clone.style.top = rect.top+"px";
  clone.style.width = rect.width+"px";
  clone.style.height = rect.height+"px";
  document.body.appendChild(clone);
  dragState.clone = clone;
  card.classList.add("hidden-drag");
}
function onDocPointerMove(e){
  if(!dragState || e.pointerId !== dragState.pointerId) return;
  const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
  if(!dragState.moved){
    if(Math.hypot(dx,dy) < 10) return;
    beginDrag();
  }
  e.preventDefault();
  dragState.clone.style.transform = `translate(${dx}px,${dy}px) scale(1.06)`;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const targetCard = under && under.closest && under.closest(".card:not(.dragClone)");
  if(targetCard && targetCard !== dragState.card){
    const r = targetCard.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const zoneX = r.width*0.3, zoneY = r.height*0.3;
    const inCore = Math.abs(e.clientX-cx) < zoneX && Math.abs(e.clientY-cy) < zoneY;
    if(inCore){
      const grid = targetCard.parentNode;
      flipReorder(grid, dragState.card, ()=>{
        const cards = [...grid.children];
        const draggedIndex = cards.indexOf(dragState.card);
        const targetIndex = cards.indexOf(targetCard);
        if(draggedIndex < targetIndex) grid.insertBefore(dragState.card, targetCard.nextSibling);
        else grid.insertBefore(dragState.card, targetCard);
      });
    }
  }
}
async function onDocPointerUp(e){
  if(!dragState || e.pointerId !== dragState.pointerId) return;
  document.removeEventListener("pointermove", onDocPointerMove);
  document.removeEventListener("pointerup", onDocPointerUp);
  document.removeEventListener("pointercancel", onDocPointerUp);
  const { card, moved, id, clone } = dragState;
  dragState = null;
  if(moved){
    card.classList.remove("hidden-drag");
    if(clone) clone.remove();
    const grid = card.parentNode;
    const newOrder = [...grid.children].map(c=>c.dataset.id);
    items = newOrder.map(oid=>items.find(it=>it.id===oid)).filter(Boolean);
    await saveShortcuts(items);
  } else {
    startEdit(id);
  }
}

function render(){
  cleanupStuckDrag();
  countText.textContent = items.length + (items.length===1?" atalho":" atalhos");

  if(items.length===0){
    listArea.innerHTML = `<div class="empty"><p style="font-weight:700;letter-spacing:.1em">NENHUM ATALHO AINDA</p><p style="font-size:12px;margin-top:6px">Adicione o primeiro atalho acima.</p></div>`;
    return;
  }
  listArea.innerHTML = `<div class="grid">${items.map(s=>`
    <div class="card ${editMode?'editing':''}" data-id="${s.id}">
      ${editMode?`<div class="grip">${GRIP}</div>`:""}
      ${editMode
        ? `<div class="cardInner"><div class="icwrap">${svgIcon(s.icon)}</div><div class="nm">${s.name.replace(/</g,"&lt;").toUpperCase()}</div></div>`
        : `<a href="${s.url}" target="_blank" rel="noopener noreferrer"><div class="icwrap">${svgIcon(s.icon)}</div><div class="nm">${s.name.replace(/</g,"&lt;").toUpperCase()}</div></a>`}
    </div>`).join("")}</div>`;

  if(editMode){
    listArea.querySelectorAll(".card").forEach(card=>card.addEventListener("pointerdown", onCardPointerDown));
  }
}

(async function init(){
  renderIconGrid();
  await initStorage();
  items = await loadShortcuts();
  render();
})();
</script>
</body>
</html>
