<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Hub">
<title>Meu Hub</title>
<style>
:root{
  --bg:#070E1E;--panel:#0D1B33;--card1:#234876;--card2:#1A365D;--border:#1E3D6B;
  --accent:#00F5FF;--text:#E8F0FF;--muted:#5E82A8;--muted2:#7DA0C9;--danger:#FF2D55;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  background-image:radial-gradient(90% 70% at 50% 0%,#1E3D6B 0%,#132A4C 25%,#0D1B33 55%,#070E1E 85%);
  min-height:100vh
}
button,input{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 40px}
.badge{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);
  background:rgba(13,27,51,.8);border-radius:999px;padding:6px 14px;
  font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--muted2)
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
h1{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:16px 0 4px;line-height:.9}
h1 .hub{color:var(--accent)}
.tag{color:var(--muted2);font-size:12px;letter-spacing:.05em;margin:8px 0 22px}
.actions{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.addbtn{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(#1C3A68,#132A4C);border:1px solid var(--border);
  border-radius:20px;padding:16px 18px;color:#fff
}
.addbtn .left{display:flex;align-items:center;gap:14px;min-width:0}
.addbtn .iconbox{
  width:44px;height:44px;flex:0 0 44px;border-radius:14px;
  background:linear-gradient(#244B80,#1A365D);display:grid;place-items:center;
  border:1px solid rgba(0,245,255,.2)
}
.addbtn .copy{min-width:0;text-align:left}
.addbtn .name{display:block;font-size:14px;font-weight:700;text-align:left}
.addbtn .sub{display:block;font-size:11px;color:#7FA7D0;text-transform:uppercase;margin-top:2px;text-align:left}
.panel{
  border:1px solid var(--border);background:rgba(13,27,51,.94);
  border-radius:24px;padding:20px;margin-bottom:22px
}
.panelTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.panelTitle{font-size:12px;letter-spacing:.15em;margin:0}
.panelActions{display:flex;gap:8px;align-items:center}
.circleBtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:var(--panel);color:#86A7CA;display:grid;place-items:center
}
.starBtn{font-size:21px;line-height:1}
.starBtn.on{color:#FFD76A;border-color:#866C2B;background:#2A2414}
label{
  display:block;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px
}
input[type=text],input[type=url]{
  width:100%;height:50px;border-radius:14px;border:1px solid var(--border);
  background:var(--bg);color:#fff;padding:0 14px;font-size:14px;outline:none;margin-bottom:16px
}
input:focus{border-color:var(--accent)}
.icons{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;border:1px solid var(--border);
  background:var(--bg);border-radius:14px;padding:10px;margin-bottom:16px
}
.icons button{
  aspect-ratio:1;border-radius:12px;border:1px solid #1A365D;background:#132A4C;
  color:#6A8CB3;display:grid;place-items:center
}
.icons button.sel{border-color:var(--accent);background:var(--accent);color:var(--bg)}
.relation{margin-bottom:16px}
.relationToggle{
  width:100%;height:48px;border-radius:14px;border:1px solid var(--border);
  background:var(--bg);color:#A8C4E5;padding:0 14px;display:flex;align-items:center;
  justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.08em
}
.relationToggle .countPill{
  min-width:24px;height:24px;border-radius:999px;background:#132A4C;color:#7FA7D0;
  display:grid;place-items:center;font-size:10px
}
.relationOptions{
  margin-top:8px;border:1px solid var(--border);border-radius:14px;background:#091426;
  padding:8px;max-height:220px;overflow:auto
}
.relationOptions[hidden]{display:none}
.relEmpty{padding:14px 10px;color:#5E82A8;font-size:11px;text-align:center}
.relOption{
  display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;
  color:#B6CEE7;font-size:12px
}
.relOption + .relOption{border-top:1px solid rgba(30,61,107,.35)}
.relOption input{width:18px;height:18px;accent-color:#00D1FF}
.relOption.selected{background:rgba(0,245,255,.08);color:#E8F0FF}
.submit{
  width:100%;height:50px;border-radius:14px;border:1px solid rgba(0,245,255,.3);
  background:linear-gradient(#00D1FF,#00A6CC);color:#06131F;font-weight:800;
  letter-spacing:.1em;font-size:13px
}
.delLink{
  width:100%;text-align:center;margin-top:24px;padding:14px 10px 2px;background:none;
  border:0;border-top:1px solid rgba(30,61,107,.55);color:#6F8EAF;
  font-size:10px;font-weight:700;letter-spacing:.1em
}
.sectionTitle{
  display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;
  letter-spacing:.15em;color:var(--muted);margin:24px 0 14px
}
.sectionTitle .ln{width:20px;height:1px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;min-width:0;aspect-ratio:1;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.hiddenDrag{visibility:hidden}
.card.dragClone{
  position:fixed;z-index:999;pointer-events:none;touch-action:none;margin:0
}
.cardSurface{
  position:absolute;inset:0;width:100%;border-radius:22px;border:1px solid rgba(30,61,107,.8);
  background:linear-gradient(160deg,var(--card1),#1E3D6B 60%,var(--card2));
  color:inherit;box-shadow:0 12px 24px rgba(0,0,0,.4);
  padding:12px 10px 42px;display:flex;flex-direction:column;align-items:center;justify-content:center
}
.cardIcon{
  width:52px;height:52px;border-radius:16px;border:1px solid rgba(42,79,130,.7);
  background:linear-gradient(#0D1B33,#070E1E);display:grid;place-items:center;color:#C7DCF5
}
.cardName{
  margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.05em;text-align:center;
  width:100%;height:2.4em;line-height:1.2;overflow:hidden;display:-webkit-box;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere
}
.openBtn{
  position:absolute;left:10px;right:10px;bottom:9px;height:27px;border-radius:9px;
  border:1px solid rgba(0,245,255,.24);background:rgba(7,14,30,.75);
  color:#9BDDE4;font-size:9px;font-weight:800;letter-spacing:.12em;z-index:3
}
.openBtn:disabled{opacity:.35;cursor:default}
.groupList{display:flex;flex-direction:column;gap:12px}
.groupWrap{
  width:100%;border:1px solid rgba(30,61,107,.8);border-radius:20px;
  background:rgba(13,27,51,.42);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none
}
.groupWrap.groupDragging{opacity:.18}
.groupWrap.groupDragClone{
  position:fixed;z-index:999;pointer-events:none;margin:0;height:74px;overflow:hidden;
  opacity:1;box-shadow:0 18px 36px rgba(0,0,0,.48);border-color:var(--accent)
}
.groupbar{width:100%;display:grid;grid-template-columns:72px minmax(0,1fr) 58px;background:linear-gradient(#1C3A68,#132A4C)}
.groupAdd,.groupNameBtn,.groupToggle{min-height:74px;border:0;background:transparent;color:#fff}
.groupAdd{border-right:1px solid var(--border);display:grid;place-items:center}
.groupAdd .miniIcon{
  width:42px;height:42px;border-radius:14px;background:linear-gradient(#244B80,#1A365D);
  border:1px solid rgba(0,245,255,.2);display:grid;place-items:center
}
.groupNameBtn{
  min-width:0;padding:0 14px;text-align:left;font-size:13px;font-weight:700;
  letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.groupToggle{border-left:1px solid rgba(30,61,107,.55);display:grid;place-items:center}
.groupToggle svg{transition:transform .2s}
.groupWrap.open .groupToggle svg{transform:rotate(90deg)}
.groupBody{display:none;padding:14px;border-top:1px solid var(--border)}
.groupWrap.open .groupBody{display:block}
.groupEmpty{padding:18px 8px;text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5E82A8}
.groupManage{margin-top:16px;padding-top:14px;border-top:1px solid rgba(30,61,107,.55)}
.groupManageBtn{width:100%;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:#A8C4E5;font-size:10px;font-weight:700;letter-spacing:.08em}
.groupEditSlot:empty{display:none}
.groupEditSlot:not(:empty){margin-top:14px}
.empty{
  text-align:center;padding:44px 20px;border:1px dashed rgba(30,61,107,.6);
  border-radius:24px;color:var(--muted2)
}
.empty p{margin:0;font-size:11px;letter-spacing:.08em}
.overlay{
  position:fixed;inset:0;background:rgba(3,8,18,.78);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:500;padding:24px
}
.modalBox{
  width:100%;max-width:340px;background:linear-gradient(#132A4C,#0D1B33);
  border:1px solid var(--border);border-radius:22px;padding:22px
}
.modalTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.modalTitle{font-size:15px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.modalMeta{font-size:11px;color:#7FA7D0;line-height:1.5;margin:8px 0 18px;overflow-wrap:anywhere}
.modalActions{display:block}
.detailDeleteZone{
  margin-top:26px;padding-top:18px;border-top:1px solid rgba(30,61,107,.55);text-align:center
}
.quietDelete{
  border:0;background:transparent;color:#6F8EAF;font-size:10px;font-weight:700;
  letter-spacing:.1em;padding:10px 16px
}
.modalBtn{
  height:44px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-weight:700;font-size:11px;letter-spacing:.06em
}
.modalBtn.danger{color:#ff9fae;border-color:#6f2634;background:#24101A}
.confirmActions{display:flex;flex-direction:column;gap:10px}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <span class="badge"><span class="dot"></span>MEU HUB <span id="statusText">LOCAL</span></span>
  <h1>MEU <span class="hub">HUB</span></h1>
  <div class="tag">Painel de atalhos pessoal</div>

  <div class="actions">
    <button class="addbtn" id="openShortcutForm">
      <span class="left">
        <span class="iconbox"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></span>
        <span class="copy"><span class="name">NOVO ATALHO</span><span class="sub">Nome + link + ícone</span></span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <button class="addbtn" id="openGroupForm">
      <span class="left">
        <span class="iconbox"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></span>
        <span class="copy"><span class="name">NOVO GRUPO</span><span class="sub">Nome + atalhos</span></span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="panel" id="panel" style="display:none">
    <div class="panelTop">
      <h2 class="panelTitle" id="panelTitle"></h2>
      <div class="panelActions">
        <button class="circleBtn starBtn" id="starBtn" type="button" aria-label="Favorito">☆</button>
        <button class="circleBtn" id="closePanel" type="button" aria-label="Fechar">
          <svg width="14" height="14" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <label>Nome</label>
    <input type="text" id="nameInput">

    <div id="shortcutFields">
      <label>Link</label>
      <input type="url" id="urlInput">

      <label>Ícone</label>
      <div class="icons" id="iconGrid"></div>

      <div class="relation">
        <button class="relationToggle" id="groupsToggle" type="button">
          <span>GRUPOS</span><span class="countPill" id="groupsCount">0</span>
        </button>
        <div class="relationOptions" id="groupsOptions" hidden></div>
      </div>
    </div>

    <div id="groupFields" style="display:none">
      <div class="relation">
        <button class="relationToggle" id="shortcutsToggle" type="button">
          <span>ATALHOS</span><span class="countPill" id="shortcutsCount">0</span>
        </button>
        <div class="relationOptions" id="shortcutsOptions" hidden></div>
      </div>
    </div>

    <button class="submit" id="submitBtn" type="button">SALVAR</button>
    <button class="delLink" id="deleteBtn" type="button" style="display:none"></button>
  </div>

  <div class="sectionTitle"><span class="ln"></span><span id="favoriteTitle">FAVORITOS</span></div>
  <div id="favoritesArea"></div>

  <div class="sectionTitle"><span class="ln"></span><span>GRUPOS</span></div>
  <div id="groupsArea" class="groupList"></div>
</div>

<div class="overlay" id="detailOverlay" style="display:none">
  <div class="modalBox" id="detailBox">
    <div class="modalTop">
      <div>
        <div class="modalTitle" id="detailTitle"></div>
        <div class="modalMeta" id="detailMeta"></div>
      </div>
      <button class="circleBtn" id="detailClose" type="button" aria-label="Fechar">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="detailSummary">
      <div class="modalActions">
        <button class="modalBtn" id="detailEdit" type="button" style="width:100%">EDITAR</button>
      </div>
    </div>
    <div id="detailEditSlot"></div>
  </div>
</div>

<script>
const ICONS = {
  Rocket:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>',
  Globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  Briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  FolderKanban:'<path d="M4 20V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>',
  Palette:'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1 0 1.7-.8 1.7-1.7 0-.9-.7-1.6-.7-2.5A1.7 1.7 0 0 1 14.6 16h2c3 0 5.4-2.5 5.4-5.5C22 5.6 17.5 2 12 2z"/>',
  FileText:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/>',
  Target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  LayoutGrid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  MessageSquare:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  Music2:'<circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/>',
  ShoppingBag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  BookOpen:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  Compass:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.65-5.65 1.8 1.8-5.65z"/>',
  Zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  Layers:'<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m2 12 8.6 3.91a2 2 0 0 0 1.65 0L22 12M2 17l8.6 3.91a2 2 0 0 0 1.65 0L22 17"/>',
  Monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  Box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>'
};
const ICON_KEYS = Object.keys(ICONS);
const LS_KEY = "atalhos_v2_local_v3";
const LONG_PRESS_MS = 220;

function svgIcon(name,w){
  var size=w||26;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24">'+(ICONS[name]||ICONS.Box)+'</svg>';
}
function esc(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function displayName(v){
  var t=String(v||'').trim();
  return t?t:'SEM NOME';
}
function openableUrl(v){
  var t=String(v||'').trim();
  if(!t) return '';
  if(!/^https?:\/\//i.test(t)) t='https://'+t;
  try{return new URL(t).href;}catch(e){return '';}
}
function seedState(){
  return {
    version:2,
    shortcuts:[
      {id:'sample-shortcut',name:'ATALHO EXEMPLO',url:'https://www.google.com',icon:'Rocket',favorite:true}
    ],
    groups:[
      {id:'sample-group',name:'GRUPO EXEMPLO',favorite:false,open:false,shortcutIds:['sample-shortcut']}
    ],
    favoriteOrder:['s:sample-shortcut']
  };
}
function normalizeState(raw){
  if(!raw || typeof raw!=='object') return seedState();
  var shortcuts=Array.isArray(raw.shortcuts)?raw.shortcuts:[];
  var groups=Array.isArray(raw.groups)?raw.groups:[];
  var shortcutIds=new Set(shortcuts.map(function(s){return s.id;}));
  var groupIds=new Set(groups.map(function(g){return g.id;}));
  var normalized={
    version:2,
    shortcuts:shortcuts.map(function(s){
      return {
        id:s.id||uid(),name:s.name||'',url:s.url||'',icon:s.icon||'Rocket',favorite:!!s.favorite
      };
    }),
    groups:groups.map(function(g){
      return {
        id:g.id||uid(),name:g.name||'',favorite:!!g.favorite,open:!!g.open,
        shortcutIds:Array.isArray(g.shortcutIds)?g.shortcutIds.filter(function(id){return shortcutIds.has(id);}):[]
      };
    }),
    favoriteOrder:Array.isArray(raw.favoriteOrder)?raw.favoriteOrder.slice():[]
  };
  var allowed=new Set();
  normalized.shortcuts.forEach(function(s){if(s.favorite) allowed.add('s:'+s.id);});
  normalized.groups.forEach(function(g){if(g.favorite) allowed.add('g:'+g.id);});
  normalized.favoriteOrder=normalized.favoriteOrder.filter(function(ref){
    return allowed.has(ref) && (ref.indexOf('s:')===0?shortcutIds.has(ref.slice(2)):groupIds.has(ref.slice(2)));
  });
  allowed.forEach(function(ref){
    if(normalized.favoriteOrder.indexOf(ref)===-1) normalized.favoriteOrder.push(ref);
  });
  return normalized;
}
function loadState(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw) return normalizeState(JSON.parse(raw));
  }catch(e){}
  return seedState();
}
function saveState(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
  statusText.textContent='LOCAL';
}
function entityRef(type,id){return (type==='shortcut'?'s:':'g:')+id;}
function getShortcut(id){return state.shortcuts.find(function(s){return s.id===id;})||null;}
function getGroup(id){return state.groups.find(function(g){return g.id===id;})||null;}
function ensureFavorite(type,id,on){
  var ref=entityRef(type,id);
  var obj=type==='shortcut'?getShortcut(id):getGroup(id);
  if(!obj) return;
  obj.favorite=!!on;
  state.favoriteOrder=state.favoriteOrder.filter(function(x){return x!==ref;});
  if(on) state.favoriteOrder.push(ref);
}
function groupIdsForShortcut(shortcutId){
  return state.groups.filter(function(g){return g.shortcutIds.indexOf(shortcutId)!==-1;}).map(function(g){return g.id;});
}
function setGroupsForShortcut(shortcutId,selectedIds){
  state.groups.forEach(function(g){
    var has=g.shortcutIds.indexOf(shortcutId)!==-1;
    var should=selectedIds.has(g.id);
    if(should && !has) g.shortcutIds.push(shortcutId);
    if(!should && has) g.shortcutIds=g.shortcutIds.filter(function(id){return id!==shortcutId;});
  });
}

function clearDrag(){
  if(!drag) return;
  clearTimeout(drag.timer);
  document.removeEventListener('pointermove',onDragMove);
  document.removeEventListener('pointerup',onDragEnd);
  document.removeEventListener('pointercancel',onDragEnd);
  if(drag.clone) drag.clone.remove();
  if(drag.card) drag.card.classList.remove('hiddenDrag');
  drag=null;
}
function onCardPointerDown(e){
  if(e.button!==undefined && e.button!==0) return;
  if(e.target.closest && e.target.closest('.openBtn')) return;
  var card=e.currentTarget;
  drag={
    card:card,
    pointerId:e.pointerId,
    startX:e.clientX,startY:e.clientY,
    active:false,moved:false,clone:null,
    timer:setTimeout(function(){activateDrag(card);},LONG_PRESS_MS)
  };
  document.addEventListener('pointermove',onDragMove,{passive:false});
  document.addEventListener('pointerup',onDragEnd);
  document.addEventListener('pointercancel',onDragEnd);
}
function activateDrag(card){
  if(!drag||drag.card!==card) return;
  drag.active=true;
  card.dataset.suppressClick='1';
  var r=card.getBoundingClientRect();
  var clone=card.cloneNode(true);
  clone.className='card dragClone';
  clone.style.left=r.left+'px';
  clone.style.top=r.top+'px';
  clone.style.width=r.width+'px';
  clone.style.height=r.height+'px';
  document.body.appendChild(clone);
  card.classList.add('hiddenDrag');
  drag.clone=clone;
  try{card.setPointerCapture(drag.pointerId);}catch(e){}
}
function onDragMove(e){
  if(!drag||e.pointerId!==drag.pointerId) return;
  var dx=e.clientX-drag.startX;
  var dy=e.clientY-drag.startY;
  if(!drag.active){
    if(Math.hypot(dx,dy)>9){
      clearTimeout(drag.timer);
    }
    return;
  }
  e.preventDefault();
  drag.moved=true;
  drag.clone.style.transform='translate('+dx+'px,'+dy+'px) scale(1.04)';
  var under=document.elementFromPoint(e.clientX,e.clientY);
  var target=under&&under.closest?under.closest('.card:not(.dragClone)'):null;
  if(!target||target===drag.card) return;
  if(target.dataset.context!==drag.card.dataset.context) return;
  if((target.dataset.groupId||'')!==(drag.card.dataset.groupId||'')) return;
  var parent=target.parentNode;
  var cards=Array.from(parent.children);
  var a=cards.indexOf(drag.card);
  var b=cards.indexOf(target);
  if(a<b) parent.insertBefore(drag.card,target.nextSibling);
  else parent.insertBefore(drag.card,target);
}
function onDragEnd(e){
  if(!drag||e.pointerId!==drag.pointerId) return;
  clearTimeout(drag.timer);
  document.removeEventListener('pointermove',onDragMove);
  document.removeEventListener('pointerup',onDragEnd);
  document.removeEventListener('pointercancel',onDragEnd);

  var d=drag;
  drag=null;
  if(d.clone) d.clone.remove();
  d.card.classList.remove('hiddenDrag');

  if(d.active){
    if(d.card.dataset.context==='favorites'){
      var grid=d.card.parentNode;
      state.favoriteOrder=Array.from(grid.children).map(function(c){return c.dataset.ref;});
    }else if(d.card.dataset.context==='group'){
      var g=getGroup(d.card.dataset.groupId);
      if(g){
        g.shortcutIds=Array.from(d.card.parentNode.children).map(function(c){
          return c.dataset.ref.slice(2);
        });
      }
    }
    saveState();
    render();
    setTimeout(function(){d.card.dataset.suppressClick='0';},250);
  }
}
function onGroupPointerDown(e){
  if(e.button!==undefined && e.button!==0) return;
  if(e.target.closest && e.target.closest('.groupAdd,.groupToggle,.card,.openBtn,.groupManage,.groupEditSlot')) return;
  var group=e.currentTarget;
  groupDrag={
    group:group,
    pointerId:e.pointerId,
    startX:e.clientX,startY:e.clientY,
    active:false,clone:null,
    timer:setTimeout(function(){activateGroupDrag(group);},LONG_PRESS_MS)
  };
  document.addEventListener('pointermove',onGroupDragMove,{passive:false});
  document.addEventListener('pointerup',onGroupDragEnd);
  document.addEventListener('pointercancel',onGroupDragEnd);
}
function activateGroupDrag(group){
  if(!groupDrag||groupDrag.group!==group) return;
  groupDrag.active=true;
  group.dataset.suppressClick='1';
  var r=group.getBoundingClientRect();
  var clone=group.cloneNode(true);
  clone.className='groupWrap groupDragClone';
  clone.style.left=r.left+'px';
  clone.style.top=r.top+'px';
  clone.style.width=r.width+'px';
  document.body.appendChild(clone);
  group.classList.add('groupDragging');
  groupDrag.clone=clone;
  try{group.setPointerCapture(groupDrag.pointerId);}catch(e){}
}
function onGroupDragMove(e){
  if(!groupDrag||e.pointerId!==groupDrag.pointerId) return;
  var dx=e.clientX-groupDrag.startX;
  var dy=e.clientY-groupDrag.startY;
  if(!groupDrag.active){
    if(Math.hypot(dx,dy)>9) clearTimeout(groupDrag.timer);
    return;
  }
  e.preventDefault();
  groupDrag.clone.style.transform='translate('+dx+'px,'+dy+'px)';
  var under=document.elementFromPoint(e.clientX,e.clientY);
  var target=under&&under.closest?under.closest('.groupWrap:not(.groupDragClone)'):null;
  if(!target||target===groupDrag.group||target.parentNode!==groupsArea) return;
  var items=Array.from(groupsArea.children).filter(function(el){return el.classList.contains('groupWrap');});
  var a=items.indexOf(groupDrag.group);
  var b=items.indexOf(target);
  if(a<b) groupsArea.insertBefore(groupDrag.group,target.nextSibling);
  else groupsArea.insertBefore(groupDrag.group,target);
}
function onGroupDragEnd(e){
  if(!groupDrag||e.pointerId!==groupDrag.pointerId) return;
  clearTimeout(groupDrag.timer);
  document.removeEventListener('pointermove',onGroupDragMove);
  document.removeEventListener('pointerup',onGroupDragEnd);
  document.removeEventListener('pointercancel',onGroupDragEnd);

  var d=groupDrag;
  groupDrag=null;
  if(d.clone) d.clone.remove();
  d.group.classList.remove('groupDragging');

  if(d.active){
    var byId=new Map(state.groups.map(function(g){return [g.id,g];}));
    state.groups=Array.from(groupsArea.children)
      .filter(function(el){return el.classList.contains('groupWrap');})
      .map(function(el){return byId.get(el.dataset.groupId);})
      .filter(Boolean);
    saveState();
    render();
    setTimeout(function(){d.group.dataset.suppressClick='0';},250);
  }
}
function render(){
  renderFavorites();
  renderGroups();
  wireActions();
  statusText.textContent='LOCAL';
}
renderIconGrid();
render();
</script>
</body>
</html>
